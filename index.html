<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Work Wish - Job Management System</title>
    <meta name="description" content="Professional job management system with PDF extraction, AI-powered SOR code matching, team assignment, and progress tracking." />
    <meta name="author" content="Allsaints" />
    <link rel="icon" href="/logo.png" type="image/png" />

    <meta property="og:title" content="Work Wish" />
    <meta property="og:description" content="Professional job management system with PDF extraction and AI-powered SOR code matching." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <script>
      // Redirect plain /archive (no hash) to hash-routed #/archive
      (function() {
        var p = window.location.pathname;
        var h = window.location.hash;
        if ((p === '/archive' || p === '/archive/') && (!h || h === '' || h === '#/' || h === '#')) {
          window.location.replace(window.location.origin + '/#/archive');
        }
      })();
      // Apply theme immediately to prevent flash
      (function() {
        const stored = localStorage.getItem('theme');

        // Default to dark unless the user explicitly chose light
        const shouldUseDark = stored !== 'light';

        if (shouldUseDark) {
          document.documentElement.classList.add('dark');
          if (!stored) localStorage.setItem('theme', 'dark');
        }
      })();

      (function() {
        var RETRY_WINDOW_MS = 30000;
        var RETRY_LIMIT = 2;

        window.__hardRefreshForModuleError = function() {
          try {
            var now = Date.now();
            var last = Number(sessionStorage.getItem('module_boot_retry_ts') || 0);
            var count = Number(sessionStorage.getItem('module_boot_retry_count') || 0);

            if (now - last < RETRY_WINDOW_MS && count >= RETRY_LIMIT) {
              console.error('Module script failed repeatedly; not retrying again.');
              return;
            }

            sessionStorage.setItem('module_boot_retry_ts', String(now));
            sessionStorage.setItem('module_boot_retry_count', String(count + 1));

            var url = new URL(window.location.href);
            url.searchParams.set('__reload', String(now));
            window.location.replace(url.toString());
          } catch (error) {
            console.error('Module recovery failed', error);
            window.location.reload();
          }
        };

        window.addEventListener('load', function() {
          setTimeout(function() {
            sessionStorage.removeItem('module_boot_retry_count');
            sessionStorage.removeItem('module_boot_retry_ts');
          }, RETRY_WINDOW_MS);
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="window.__hardRefreshForModuleError && window.__hardRefreshForModuleError()"></script>
  </body>
</html>
